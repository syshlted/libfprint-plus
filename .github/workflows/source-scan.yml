name: Upstream source scan

# Fetches each pinned source by exact commit and scans it with CodeQL, cppcheck
# and osv-scanner. Runs when the pins change and weekly, to catch newly
# published CVEs.

on:
  push:
    branches: [master]
    paths: [upstreams.json, packaging/**, scripts/fetch-upstream.sh, .github/workflows/source-scan.yml]
  pull_request:
    paths: [upstreams.json, packaging/**, scripts/fetch-upstream.sh, .github/workflows/source-scan.yml]
  schedule:
    - cron: '29 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: goodix
            cppcheck_paths: libfprint/drivers/goodixtls
            apt_extra: ''
          - source: cs9711
            cppcheck_paths: libfprint/drivers/cs9711 libfprint/sigfm
            apt_extra: libopencv-dev doctest-dev
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned source
        run: scripts/fetch-upstream.sh ${{ matrix.source }} upstream-src/${{ matrix.source }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libglib2.0-dev libgusb-dev libgudev-1.0-dev libnss3-dev libpixman-1-dev libssl-dev libcairo2-dev gobject-introspection libgirepository1.0-dev cppcheck ${{ matrix.apt_extra }}
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build for CodeQL
        run: |
          cd upstream-src/${{ matrix.source }}
          meson setup build -Ddoc=false -Dgtk-examples=false -Dintrospection=false -Dinstalled-tests=false -Ddrivers=all
          ninja -C build
      - uses: github/codeql-action/analyze@v3
        with:
          category: /source:${{ matrix.source }}
      - name: cppcheck
        run: |
          cd upstream-src/${{ matrix.source }}
          cppcheck --error-exitcode=1 --enable=warning,portability --suppress=missingIncludeSystem -q ${{ matrix.cppcheck_paths }}
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: --recursive upstream-src/${{ matrix.source }}
        continue-on-error: true
